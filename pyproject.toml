[project]
name = "simulation-drone"
version = "0.0.1"
description = "SITL simulated multirotor: physics sim, sensor models, log analysis"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["sim", "tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["drone_sim", "logreplay"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["sim/drone_sim", "tools/logreplay", "tools/check_traceability.py"]

[tool.pytest.ini_options]
testpaths = ["sim", "tools", "tests_py"]
