[project]
name = "simulation-drone"
version = "0.0.1"
description = "SITL simulated multirotor: physics sim, sensor models, log analysis"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["sim", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["sim", "tools"]

[tool.pytest.ini_options]
testpaths = ["sim", "tools", "tests_py"]
